name: flight-deck
on:
  push:
    paths:
      - "web/deck/**"
      - ".github/workflows/flight-deck.yml"
  pull_request:
    paths:
      - "web/deck/**"
      - ".github/workflows/flight-deck.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/deck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/deck/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
