name: flight-deck
on:
  push:
    paths:
      - "web/deck/**"
      - ".github/workflows/flight-deck.yml"
  pull_request:
    paths:
      - "web/deck/**"
      - ".github/workflows/flight-deck.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/deck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/deck/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
